<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HotPotChef — Home kitchens. Near you. On your slot.</title>
    <meta
      name="description"
      content="HotPotChef connects you with neighbourhood home kitchens on your slot. Home kitchens. Near you. On your slot."
    />
    <meta property="og:title" content="HotPotChef" />
    <meta property="og:description" content="Home kitchens. Near you. On your slot." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hotpotchef.com/" />
    <meta name="theme-color" content="#1a1410" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <main class="home-hero">
      <div class="wrap">
        <h1 class="brand">HotPot<span>Chef</span></h1>
        <p class="punchline">Home kitchens. Near you. On your slot.</p>
        <p class="support">
          Neighbourhood plates from verified home kitchens — ordered for the slot that fits your day.
        </p>
        <div class="cta-row">
          <a class="btn btn-primary" id="play-cta" href="https://play.google.com/store/apps/details?id=com.hotpotchef.app"
            >Get the app</a
          >
          <a class="btn btn-ghost" href="mailto:hello@hotpotchef.com">hello@hotpotchef.com</a>
        </div>
      </div>
    </main>
    <p class="footer-note">Shared dish links open at hotpotchef.com/meal/… and deep-link into the app when installed.</p>
    <script src="/js/config.js"></script>
    <script>
      (function () {
        var cfg = window.HOTPOTCHEF || {};
        var play = document.getElementById('play-cta');
        if (play && cfg.playStoreUrl) play.href = cfg.playStoreUrl;
      })();
    </script>
  </body>
</html>
