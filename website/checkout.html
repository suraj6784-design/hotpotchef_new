<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · HotPotChef</title>
    <meta name="theme-color" content="#1a1410" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div class="wrap site-top">
      <a href="/">HotPot<strong>Chef</strong></a>
      <a class="cart-link" href="/cart">Cart <span data-cart-count hidden></span></a>
    </div>

    <main class="meal-page">
      <div class="wrap">
        <article class="meal-card">
          <p class="meal-kicker">Web checkout</p>
          <h1 class="meal-title">Pay securely</h1>
          <p class="meal-meta" id="checkout-user">Sign in required · same account as the app</p>

          <div id="checkout-items" class="web-cart-list"></div>
          <p class="meal-price" id="checkout-subtotal" hidden></p>

          <form class="auth-form" id="checkout-form">
            <label>
              Phone
              <input id="co-phone" type="tel" required minlength="10" autocomplete="tel" />
            </label>
            <label id="co-saved-wrap" hidden>
              Saved address
              <select id="co-saved-address" aria-label="Saved delivery address"></select>
            </label>
            <label>
              Delivery address
              <textarea id="co-address" rows="3" required placeholder="Flat, society, landmark, city"></textarea>
            </label>
            <label>
              Instructions (optional)
              <input id="co-notes" type="text" placeholder="Gate code, spice level…" />
            </label>
            <label class="auth-check">
              <input id="co-delivery-fee" type="checkbox" checked />
              Add ₹40 delivery partner fee
            </label>
            <p class="status" id="co-status" hidden></p>
            <div class="cta-row">
              <button class="btn btn-primary" type="submit" id="co-pay">Pay with Razorpay</button>
              <a class="btn btn-ghost" href="/cart">Back to cart</a>
            </div>
          </form>
        </article>
      </div>
    </main>

    <p class="footer-note">Uses the same create-split-order / recover-payment flow as the Android app.</p>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/checkout-page.js"></script>
  </body>
</html>
